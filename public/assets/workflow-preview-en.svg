<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="t d"><title id="t">Requests with a contract</title><desc id="d">Validated input, review and decision with version checks. Personal prototype.</desc><rect width="1280" height="800" fill="#111113"/><g fill="none" stroke="#363336"><circle cx="1130" cy="95" r="300"/><circle cx="1130" cy="95" r="260" stroke-dasharray="220 80"/><path d="M64 164H1216M64 688H1216"/></g><g font-family="Arial,sans-serif"><text x="64" y="99" fill="#f06a73" font-size="18" letter-spacing="4">ALEJANDRO’STECH / INTEGRATIONS</text><text x="64" y="246" fill="#f2eee8" font-family="Georgia,serif" font-size="64">Requests with a contract.</text><text x="66" y="296" fill="#aaa5a4" font-size="23">Validate. Review. Decide. Preserve the journey.</text><g fill="#19191c" stroke="#484247"><rect x="64" y="378" width="340" height="188" rx="6"/><rect x="470" y="378" width="340" height="188" rx="6"/><rect x="876" y="378" width="340" height="188" rx="6"/></g><g fill="#f06a73" font-size="16" letter-spacing="2"><text x="92" y="418">01 / INPUT</text><text x="498" y="418">02 / REVIEW</text><text x="904" y="418">03 / DECISION</text></g><g fill="#f2eee8" font-size="28"><text x="92" y="469">Valid request</text><text x="498" y="469">State + version</text><text x="904" y="469">Approve or reject</text></g><g fill="#aaa5a4" font-size="18"><text x="92" y="518">Data and operation key</text><text x="498" y="518">No skipped steps</text><text x="904" y="518">Each change leaves an event</text></g><g fill="none" stroke="#f06a73" stroke-width="2"><path d="M418 472h38m-8-7 8 7-8 7M824 472h38m-8-7 8 7-8 7"/></g><text x="64" y="627" fill="#f06a73" font-size="20">201 create · 200 replay · 409 conflict</text><text x="64" y="742" fill="#aaa5a4" font-size="17">PERSONAL PROTOTYPE / .NET 10 / LOCAL DEMO</text><text x="1216" y="742" text-anchor="end" fill="#aaa5a4" font-size="17">ES / EN</text></g></svg>
