name: Verify bilingual website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned build tools
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check JavaScript syntax
        run: |
          find scripts src -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n 1 node --check
      - name: Build
        run: node scripts/build.mjs
      - name: Verify languages, links and assets
        run: node scripts/check.mjs
      - name: Verify committed output matches sources
        run: git diff --exit-code -- dist/
