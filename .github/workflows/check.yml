name: Verify bilingual website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned build tools
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Check JavaScript syntax
        run: |
          find scripts src -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n 1 node --check
      - name: Build
        run: node scripts/build.mjs
      - name: Verify languages, links and assets
        run: node scripts/check.mjs
      - name: Verify committed output matches sources
        run: git diff --exit-code -- dist/
  workflow-api:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: examples/workflow-api/global.json
      - name: Compile the local API reference
        run: dotnet build examples/workflow-api/src/WorkflowApi/WorkflowApi.csproj -c Release
      - name: Verify domain scenarios and concurrent changes
        run: dotnet run --project examples/workflow-api/tests/WorkflowChecks/WorkflowChecks.csproj -c Release
      - name: Verify actual HTTP requests
        run: node scripts/check-workflow-http.mjs
